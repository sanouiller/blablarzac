<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>blablarzac — script &amp; dialogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #16161e; }
    ::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 3px; }
    select option { background: #1e1e28; color: #f0ede8; }
    .ldrag:hover .dh { opacity: 1 !important; }

    /* ── IMPRESSION DIRECTE ── */
    #print-area { display: none; }
    @page { size: A4; margin: 16mm 15mm 18mm; @bottom-right { content: counter(page) " / " counter(pages); font: 8pt 'Courier Prime', monospace; color: #888; } }
    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
      body > #root { display: none !important; }
      #print-area { display: block !important; font-family: 'Courier Prime', Courier, monospace; color: #111; font-size: 11pt; line-height: 1.55; text-align: left; }
      #print-area h1 { font-family: 'Syne', Arial, sans-serif; font-size: 20pt; font-weight: 900; letter-spacing: -.5px; border-bottom: 3px solid #111; padding-bottom: 6px; margin-bottom: 14px; }
      #print-area .pseq { background: #111; color: #fff; font-family: 'Syne', Arial, sans-serif; font-weight: 800; font-size: 11pt; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 10px; margin: 26px 0 10px; break-after: avoid; }
      #print-area h1 + .pseq, #print-area .psub + .pseq { margin-top: 8px; }
      #print-area .pseq { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
      #print-area .pseq.pb { break-before: page; margin-top: 0; }
      #print-area .pseq .pd { font-family: 'Courier Prime', Courier, monospace; font-weight: 400; font-size: 9pt; letter-spacing: 0; text-transform: none; opacity: .8; white-space: nowrap; }
      #print-area .psub { font-size: 9.5pt; color: #666; margin: -8px 0 10px; }
      #print-area .psc { font-family: 'Syne', Arial, sans-serif; font-weight: 700; font-size: 12pt; border-bottom: 1px solid #bbb; padding-bottom: 3px; margin: 16px 0 8px; break-after: avoid; }
      #print-area .pmeta { font-size: 10pt; background: #f4f4f4; padding: 6px 10px; margin-bottom: 8px; break-inside: avoid; }
      #print-area .pnote { font-style: italic; font-size: 10pt; border-left: 3px solid #111; padding-left: 10px; margin-bottom: 12px; color: #333; break-inside: avoid; }
      #print-area .pblk { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; break-inside: avoid; }
      #print-area .pblk.r { flex-direction: row-reverse; }
      #print-area .pav { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-top: 17px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', Arial, sans-serif; font-weight: 900; font-size: 10pt; color: rgba(0,0,0,.75); }
      #print-area .pbd { flex: 1; min-width: 0; }
      #print-area .phd { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
      #print-area .pblk.r .phd { flex-direction: row-reverse; }
      #print-area .pnum { font-size: 8pt; color: #999; min-width: 14px; text-align: center; }
      #print-area .pnam { font-family: 'Syne', Arial, sans-serif; font-weight: 800; font-size: 9.5pt; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid #999; }
      #print-area .pton { font-style: italic; font-size: 9pt; color: #666; }
      #print-area .prep { border: 1px solid #ddd; border-radius: 6px; padding: 5px 10px; background: #fafafa; text-align: left; }
      #print-area .psta { font-style: italic; font-size: 10pt; color: #6b4fc9; margin-top: 3px; }
      #print-area .pstg { font-style: italic; color: #6b4fc9; background: rgba(167,139,250,.10); border: 1px dashed rgba(167,139,250,.6); border-radius: 6px; padding: 4px 10px; margin-bottom: 10px; break-inside: avoid; }
      #print-area .psil { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: #777; font-size: 9pt; font-weight: 700; letter-spacing: 4px; break-inside: avoid; }
      #print-area .psil i { flex: 1; border-top: 1px dashed #aaa; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="print-area"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module">
    import { createElement, useState, useRef, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(createElement);

    /* ══ CONSTANTES ══ */
    const TONES = ["neutre","joyeux","triste","en colère","sarcastique","murmure","cri","hésitant","autoritaire","tendre","ironique","peureux","mystérieux","urgent","pressé","froid","chaleureux"];
    const COLORS = ["#f0a500","#e05f2c","#4ecdc4","#a78bfa","#f472b6","#34d399","#60a5fa","#fb923c","#a3e635","#f87171"];
    const SHORTCUTS = [
      ["Alt + R","Nouvelle réplique"],["Alt + S","Silence"],["Alt + D","Didascalie"],
      ["Entrée","Réplique suivante (autre perso)"],["Maj + Entrée","Retour à la ligne"],
      ["Ctrl + Z","Annuler (undo)"],["Tab","Aller à la ligne suivante"],
    ];
    const D="#0d0d12",S="#16161e",S2="#1e1e28",BR="#2a2a38",AC="#f0a500",TX="#f0ede8",MT="#8888aa",PU="#a78bfa";

    /* ══ HELPERS D'ÉTAT ══ */
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

    const mkSeq   = (n) => ({ id:uid(), number:String(n), name:"" });
    const mkScene = (n, sequenceId) => ({ id:uid(), sequenceId, number:String(n), name:"", props:"", notes:"", lines:[] });

    const encode = (s) => { try { return btoa(unescape(encodeURIComponent(JSON.stringify(s)))); } catch { return null; } };
    const decode = (s) => { try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch { return null; } };

    /* Nettoyage + ajout des séquences aux anciennes sauvegardes (v1, v2) */
    const normalize = (s) => {
      const legacy = !Array.isArray(s.sequences) || !s.sequences.length;
      const sequences = legacy ? [{ id:uid(), number:"1", name:"" }] : s.sequences;
      const scenes = s.scenes.map(x => ({
        props:"", notes:"", lines:[], ...x,
        name: legacy && /^Scène \d+$/i.test((x.name||"").trim()) ? "" : (x.name||""),
        sequenceId: sequences.some(q=>q.id===x.sequenceId) ? x.sequenceId : sequences[0].id
      }));
      const cur = scenes.some(x=>x.id===s.currentSceneId) ? s.currentSceneId : scenes[0].id;
      return { film:s.film||{title:"Sans titre"}, characters:s.characters||[], sequences, scenes, currentSceneId:cur };
    };

    /* Migration ancien format (v1 : lines au top-level) */
    const migrate = (s) => {
      if (!s) return null;
      if (s.lines && !s.scenes) {
        const sc = { id:uid(), number:s.film?.sceneNumber||"1", name:s.film?.sceneName||"",
                     props:s.film?.props||"", notes:s.film?.notes||"", lines:s.lines||[] };
        s = { film:{ title:s.film?.title||"Sans titre" }, characters:s.characters||[], scenes:[sc], currentSceneId:sc.id };
      }
      if (!s.scenes?.length) return null;
      return normalize(s);
    };

    /* ── Durées estimées (0,4 s / mot parlé + 2 s / silence) ── */
    const sceneSecs = (sc) => {
      const w = sc.lines.filter(l=>l.type==="dialogue").reduce((a,l)=>a+(l.text?.split(/\s+/).filter(Boolean).length||0),0);
      return w*0.4 + sc.lines.filter(l=>l.type==="silence").length*2;
    };
    const sumSecs = (list) => list.reduce((a,x)=>a+sceneSecs(x),0);
    const fmtDur  = (raw) => { const s=Math.round(raw); return s<60 ? `${s}s` : `${Math.floor(s/60)}min ${String(s%60).padStart(2,"0")}s`; };

    /* ── Enchaînement rapide : qui parle ensuite ? (le dernier interlocuteur différent, sinon le suivant de la liste) ── */
    const pickSpeaker = (chars, before) => {
      if (!chars.length) return "";
      const spoken = before.filter(l=>l.type==="dialogue" && chars.some(c=>c.id===l.characterId));
      if (!spoken.length) return chars[0].id;
      const last = spoken[spoken.length-1];
      for (let i=spoken.length-2; i>=0; i--) if (spoken[i].characterId!==last.characterId) return spoken[i].characterId;
      const k = chars.findIndex(c=>c.id===last.characterId);
      return chars[(k+1)%chars.length].id;
    };

    /* ── Mise en page d'impression (fidèle à l'écran : gauche/droite par personnage) ── */
    const escH = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const nl2br = (s) => escH(s).replace(/\n/g,"<br>");
    const safeColor = (c) => /^#[0-9a-f]{3,8}$/i.test(c||"") ? c : "#999999";

    const buildPrintHtml = (st) => {
      const { film, characters, sequences, scenes } = st;
      const cmap = Object.fromEntries(characters.map((c,i)=>[c.id, { ...c, right: i%2===1 }]));
      const pb = film.pageBreak !== false;
      let h = `<h1>${escH(film.title)}</h1><div class="psub">Durée estimée totale : ${fmtDur(sumSecs(scenes))}</div>`;
      sequences.forEach((q, qi) => {
        h += `<div class="pseq${pb && qi>0 ? " pb" : ""}"><span>Séquence ${escH(q.number)}${q.name ? " — "+escH(q.name) : ""}</span><span class="pd">env. ${fmtDur(sumSecs(scenes.filter(x=>x.sequenceId===q.id)))}</span></div>`;
        scenes.filter(x=>x.sequenceId===q.id).forEach(scene => {
          h += `<div class="psc">Scène ${escH(scene.number)}${scene.name ? " — "+escH(scene.name) : ""}</div>`;
          if (scene.props) h += `<div class="pmeta"><strong>ACCESSOIRES :</strong> ${nl2br(scene.props)}</div>`;
          if (scene.notes) h += `<div class="pnote"><strong>Notes :</strong><br>${nl2br(scene.notes)}</div>`;
          let n = 0;
          scene.lines.forEach(l => {
            if (l.type === "silence") {
              h += `<div class="psil"><i></i><span>SILENCE</span><i></i></div>`;
            } else if (l.type === "stage_direction") {
              h += `<div class="pstg">( ${nl2br(l.text||"…")} )</div>`;
            } else {
              n++;
              const c = cmap[l.characterId], col = safeColor(c?.color), right = !!c?.right;
              const side = right ? "right" : "left", other = right ? "left" : "right";
              h += `<div class="pblk${right?" r":""}">
                <div class="pav" style="background:${col}">${escH((c?.name||"?")[0]?.toUpperCase()||"?")}</div>
                <div class="pbd">
                  <div class="phd"><span class="pnum">${n}</span><span class="pnam" style="border-color:${col}">${escH(c?.name||"?")}</span>${l.tone&&l.tone!=="neutre"?`<span class="pton">(${escH(l.tone)})</span>`:""}</div>
                  <div class="prep" style="border-${side}:3px solid ${col}">${nl2br(l.text||"…")}</div>
                  ${l.stageDirection?`<div class="psta">( ${nl2br(l.stageDirection)} )</div>`:""}
                </div>
              </div>`;
            }
          });
        });
      });
      return h;
    };

    const makeDefault = () => { const q=mkSeq(1), sc=mkScene(1,q.id); return { film:{title:"Sans titre"}, characters:[], sequences:[q], scenes:[sc], currentSceneId:sc.id }; };

    const loadInit = () => {
      const hash = window.location.hash.slice(1);
      if (hash) { const d=migrate(decode(hash)); if (d) return d; }
      try {
        const v2 = localStorage.getItem('bbz_v2'); if (v2) { const d=migrate(JSON.parse(v2)); if (d) return d; }
        const v1 = localStorage.getItem('blablarzac'); if (v1) { const d=migrate(JSON.parse(v1)); if (d) return d; }
      } catch {}
      return makeDefault();
    };


    /* ── PDF direct (jsPDF) — même mise en page que l'impression ── */
    const hexRGB = (c) => { let h = safeColor(c).slice(1); if (h.length===3) h = h.split("").map(x=>x+x).join(""); h = h.slice(0,6); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
    const pdfSafe = (s) => String(s ?? "").replace(/[\u00a0\u202f\u2009]/g," ").replace(/[→➜➔]/g,"->")
      .replace(/[^\n\x20-\x7E\xA0-\xFF\u2018\u2019\u201C\u201D\u2013\u2014\u2026\u2022\u0152\u0153\u20AC]/g,"");

    const buildPDF = (st, JsPDF) => {
      const { film, characters, sequences, scenes } = st;
      const doc = new JsPDF({ unit:"mm", format:"a4" });
      const W=210, ML=15, TOP=16, LIM=277, CW=W-2*ML;
      const pb = film.pageBreak !== false;
      const cmap = Object.fromEntries(characters.map((c,i)=>[c.id, { ...c, right: i%2===1 }]));
      let y = TOP;
      const newPage = () => { doc.addPage(); y = TOP; };
      const need = (h) => { if (y+h > LIM) newPage(); };
      const font = (f, style, size, rgb) => { doc.setFont(f, style); doc.setFontSize(size); doc.setTextColor(rgb[0],rgb[1],rgb[2]); };
      const wrap = (txt, f, style, size, width) => { doc.setFont(f, style); doc.setFontSize(size); return doc.splitTextToSize(pdfSafe(txt), width); };

      /* Titre */
      font("helvetica","bold",20,[17,17,17]);
      wrap(film.title||"Sans titre","helvetica","bold",20,CW).forEach(ln => { doc.text(ln, ML, y+6); y += 8.5; });
      y += 1; doc.setDrawColor(17,17,17); doc.setLineWidth(.8); doc.line(ML,y,ML+CW,y); y += 5;
      font("courier","normal",9,[110,110,110]);
      doc.text("Durée estimée totale : "+fmtDur(sumSecs(scenes)), ML, y); y += 4;

      sequences.forEach((q, qi) => {
        if (pb && qi>0) newPage(); else y += qi>0 ? 7 : 3;
        need(32);
        doc.setFillColor(17,17,17); doc.rect(ML,y,CW,7.5,"F");
        font("helvetica","bold",10.5,[255,255,255]);
        doc.text(pdfSafe("SÉQUENCE "+q.number+(q.name?" — "+q.name.toUpperCase():"")), ML+3, y+5.1);
        font("courier","normal",8.5,[225,225,225]);
        doc.text("env. "+fmtDur(sumSecs(scenes.filter(x=>x.sequenceId===q.id))), ML+CW-3, y+5, { align:"right" });
        y += 7.5 + 5;

        scenes.filter(x=>x.sequenceId===q.id).forEach(scene => {
          need(26);
          font("helvetica","bold",12,[17,17,17]);
          doc.text(pdfSafe("Scène "+scene.number+(scene.name?" — "+scene.name:"")), ML, y+4); y += 6;
          doc.setDrawColor(187,187,187); doc.setLineWidth(.25); doc.line(ML,y,ML+CW,y); y += 4;

          if (scene.props) {
            const pl = wrap("ACCESSOIRES : "+scene.props,"courier","normal",9,CW-6); const h = pl.length*4+3;
            need(h); doc.setFillColor(244,244,244); doc.rect(ML,y,CW,h,"F"); font("courier","normal",9,[40,40,40]);
            pl.forEach((ln,i)=>doc.text(ln, ML+3, y+1.5+4*(i+0.8))); y += h+3;
          }
          if (scene.notes) {
            const nl = wrap("Notes : "+scene.notes,"courier","italic",9.5,CW-6); const h = nl.length*4.2+2;
            need(h); doc.setFillColor(17,17,17); doc.rect(ML,y,0.9,h,"F"); font("courier","italic",9.5,[60,60,60]);
            nl.forEach((ln,i)=>doc.text(ln, ML+4, y+1+4.2*(i+0.8))); y += h+4;
          }

          let n = 0;
          scene.lines.forEach(l => {
            if (l.type === "silence") {
              need(9); const cy = y+4, label = "S I L E N C E", mid = ML+CW/2;
              font("helvetica","bold",8,[119,119,119]); const w = doc.getTextWidth(label);
              doc.setDrawColor(170,170,170); doc.setLineWidth(.3); doc.setLineDashPattern([1.2,1.2],0);
              doc.line(ML,cy,mid-w/2-3,cy); doc.line(mid+w/2+3,cy,ML+CW,cy); doc.setLineDashPattern([],0);
              doc.text(label, mid, cy+1, { align:"center" }); y += 9;
            } else if (l.type === "stage_direction") {
              const sl = wrap("( "+(l.text||"…")+" )","courier","italic",10,CW-6), h = sl.length*4.6+3.2;
              need(h); doc.setFillColor(243,240,254); doc.setDrawColor(190,170,245); doc.setLineWidth(.25); doc.setLineDashPattern([1,1],0);
              doc.roundedRect(ML,y,CW,h,1.2,1.2,"FD"); doc.setLineDashPattern([],0);
              font("courier","italic",10,[107,79,201]); sl.forEach((ln,i)=>doc.text(ln, ML+3, y+1.6+4.6*(i+0.75))); y += h+3;
            } else {
              n++;
              const c = cmap[l.characterId], col = hexRGB(c?.color), right = !!c?.right;
              const AV=6, GAP=2.5, bodyW = CW-AV-GAP, bodyX = right ? ML : ML+AV+GAP;
              const PAD=2.2, LH=4.5, HDR=5.5;
              const tl = wrap(l.text||"…","courier","normal",10,bodyW-PAD-3.4);
              const sl = l.stageDirection ? wrap("( "+l.stageDirection+" )","courier","italic",9,bodyW-2) : [];
              const fullH = HDR + PAD*2 + tl.length*LH + (sl.length ? sl.length*4+1 : 0) + 3.5;
              if (y+fullH > LIM && fullH <= LIM-TOP) newPage();
              need(HDR + PAD*2 + LH*2);
              /* en-tête : numéro, nom, ton (inversé à droite) */
              const tone = l.tone && l.tone!=="neutre" ? l.tone : "";
              const items = [ { t:String(n), f:["courier","normal",8,[150,150,150]] },
                              { t:pdfSafe((c?.name||"?").toUpperCase()), f:["helvetica","bold",9,[17,17,17]], ul:col } ];
              if (tone) items.push({ t:"("+pdfSafe(tone)+")", f:["courier","italic",8.5,[110,110,110]] });
              let cx = right ? bodyX+bodyW : bodyX;
              items.forEach(it => {
                font(it.f[0],it.f[1],it.f[2],it.f[3]); const w = doc.getTextWidth(it.t), x = right ? cx-w : cx;
                doc.text(it.t, x, y+3.6);
                if (it.ul) { doc.setDrawColor(it.ul[0],it.ul[1],it.ul[2]); doc.setLineWidth(.6); doc.line(x,y+4.5,x+w,y+4.5); }
                cx = right ? x-2 : x+w+2;
              });
              /* pastille */
              const avx = right ? ML+CW-AV/2 : ML+AV/2, avy = y+HDR+4.2;
              doc.setFillColor(col[0],col[1],col[2]); doc.circle(avx,avy,AV/2,"F");
              font("helvetica","bold",10,[40,40,40]); doc.text(pdfSafe((c?.name||"?")[0]||"?").toUpperCase(), avx, avy+1.3, { align:"center" });
              y += HDR;
              /* cadre de la réplique (découpé si plus long qu'une page) */
              let idx = 0;
              while (idx < tl.length) {
                const avail = Math.floor((LIM - y - PAD*2)/LH);
                if (avail < 1) { newPage(); continue; }
                const chunk = tl.slice(idx, idx+avail), bh = chunk.length*LH + PAD*2;
                doc.setFillColor(250,250,250); doc.setDrawColor(221,221,221); doc.setLineWidth(.25);
                doc.roundedRect(bodyX,y,bodyW,bh,1.2,1.2,"FD");
                doc.setFillColor(col[0],col[1],col[2]); doc.rect(right ? bodyX+bodyW-0.9 : bodyX, y+0.3, 0.9, bh-0.6, "F");
                font("courier","normal",10,[17,17,17]);
                chunk.forEach((ln,i)=>doc.text(ln, bodyX+PAD+(right?0:1.2), y+PAD+LH*(i+0.75)));
                y += bh; idx += chunk.length;
                if (idx < tl.length) newPage();
              }
              if (sl.length) { y += 1; font("courier","italic",9,[107,79,201]); sl.forEach(ln => { need(4); doc.text(ln, bodyX+1, y+3); y += 4; }); }
              y += 3.5;
            }
          });
        });
      });

      const N = doc.getNumberOfPages();
      for (let p=1; p<=N; p++) {
        doc.setPage(p); font("courier","normal",8,[136,136,136]);
        doc.text(pdfSafe(film.title||"")+"  ·  "+p+" / "+N, ML+CW, 289, { align:"right" });
      }
      const name = ((film.title||"scenario").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase() || "scenario") + ".pdf";
      return { doc, name };
    };

    /* ══ COMPOSANT PRINCIPAL ══ */
    function App() {
      const [st, _setSt] = useState(loadInit);
      const [panel,  setPanel]  = useState("scenes");
      const [dragIdx, setDragIdx] = useState(null);
      const [dragOver,setDragOver]= useState(null);
      const [showSC,  setShowSC]  = useState(false);
      const [toast,   setToast]   = useState(null);
      const [quick,   setQuick]   = useState(() => { try { return localStorage.getItem('bbz_quick') !== '0'; } catch { return true; } });
      const toggleQuick = () => setQuick(q => { try { localStorage.setItem('bbz_quick', q?'0':'1'); } catch {} return !q; });
      const fileRef = useRef();
      const hist    = useRef([st]);
      const cmds    = useRef({});   // pointeur vers les commandes courantes

      /* setSt avec historique */
      const setSt = (upd) => _setSt(prev => {
        const next = typeof upd === 'function' ? upd(prev) : upd;
        if (next === prev) return prev;
        hist.current = [...hist.current.slice(-79), next];
        return next;
      });

      /* Undo — utilise seulement le ref, stable */
      const undo = () => {
        if (hist.current.length < 2) return;
        hist.current = hist.current.slice(0, -1);
        _setSt(hist.current[hist.current.length - 1]);
      };

      /* Auto-save localStorage */
      useEffect(() => {
        const t = setTimeout(() => { try { localStorage.setItem('bbz_v2', JSON.stringify(st)); } catch {} }, 700);
        return () => clearTimeout(t);
      }, [st]);

      /* Raccourcis clavier — enregistré une fois, lit cmds.current */
      useEffect(() => {
        const h = (e) => {
          if (e.ctrlKey && e.key === 'z') { e.preventDefault(); cmds.current.undo?.(); }
          if (e.altKey  && e.key === 'r') { e.preventDefault(); cmds.current.addLine?.('dialogue'); }
          if (e.altKey  && e.key === 's') { e.preventDefault(); cmds.current.addLine?.('silence'); }
          if (e.altKey  && e.key === 'd') { e.preventDefault(); cmds.current.addLine?.('stage_direction'); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);

      /* Toast */
      const toast_ = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2500); };

      /* ── Dérivés ── */
      const { film, characters, sequences, scenes } = st;
      const sc = scenes.find(s=>s.id===st.currentSceneId) || scenes[0];  // scène courante
      const lines = sc.lines;
      const seq = sequences.find(q=>q.id===sc.sequenceId) || sequences[0];

      /* ── Film ── */
      const upFilm = (k,v) => setSt(s=>({...s, film:{...s.film,[k]:v}}));

      /* ── Scènes ── */
      const nextNum = (arr, fallback) => { const ns = arr.map(x=>parseInt(x.number,10)).filter(n=>!isNaN(n)); return (ns.length ? Math.max(...ns) : fallback) + 1; };
      const addSequence = () => setSt(s=>{
        const q = mkSeq(nextNum(s.sequences, s.sequences.length)), n = mkScene(1, q.id);
        return {...s, sequences:[...s.sequences,q], scenes:[...s.scenes,n], currentSceneId:n.id};
      });
      const addScene = (seqId) => setSt(s=>{
        const qid = seqId || s.scenes.find(x=>x.id===s.currentSceneId)?.sequenceId || s.sequences[0].id;
        const inSeq = s.scenes.filter(x=>x.sequenceId===qid);
        const n = mkScene(nextNum(inSeq, inSeq.length), qid);
        const arr = [...s.scenes]; arr.splice(s.scenes.map(x=>x.sequenceId).lastIndexOf(qid)+1, 0, n);
        return {...s, scenes:arr, currentSceneId:n.id};
      });
      const rmScene  = (id) => {
        if (scenes.length<=1) return;
        setSt(s=>{ const ns=s.scenes.filter(x=>x.id!==id); return {...s, scenes:ns, currentSceneId:s.currentSceneId===id?ns[0].id:s.currentSceneId}; });
      };
      const rmSequence = (id) => {
        if (sequences.length<=1) return;
        const inSeq = scenes.filter(x=>x.sequenceId===id);
        if (inSeq.some(x=>x.lines.length) && !confirm("Supprimer cette séquence et toutes ses scènes ?")) return;
        setSt(s=>{
          const qs = s.sequences.filter(q=>q.id!==id);
          let ns = s.scenes.filter(x=>x.sequenceId!==id);
          if (!ns.length) ns = [mkScene(1, qs[0].id)];
          return {...s, sequences:qs, scenes:ns, currentSceneId: ns.some(x=>x.id===s.currentSceneId) ? s.currentSceneId : ns[0].id};
        });
      };
      const upSeq = (id,k,v) => setSt(s=>({...s, sequences:s.sequences.map(q=>q.id===id?{...q,[k]:v}:q)}));
      const moveSeq = (id,d) => setSt(s=>{
        const i=s.sequences.findIndex(q=>q.id===id), t=i+d; if (t<0||t>=s.sequences.length) return s;
        const a=[...s.sequences]; [a[i],a[t]]=[a[t],a[i]]; return {...s, sequences:a};
      });
      const moveScene = (id,d) => setSt(s=>{
        const q = s.scenes.find(x=>x.id===id).sequenceId;
        const idx = s.scenes.map((x,i)=>x.sequenceId===q?i:-1).filter(i=>i>=0);
        const p = idx.findIndex(i=>s.scenes[i].id===id), t = p+d; if (t<0||t>=idx.length) return s;
        const a=[...s.scenes]; [a[idx[p]],a[idx[t]]]=[a[idx[t]],a[idx[p]]]; return {...s, scenes:a};
      });
      const setSceneSeq = (id,qid) => setSt(s=>{
        const m = s.scenes.find(x=>x.id===id); if (!m || m.sequenceId===qid) return s;
        const rest = s.scenes.filter(x=>x.id!==id);
        const a=[...rest]; a.splice(rest.map(x=>x.sequenceId).lastIndexOf(qid)+1, 0, {...m, sequenceId:qid});
        return {...s, scenes:a};
      });
      const upSc = (k,v) => setSt(s=>({...s, scenes:s.scenes.map(x=>x.id===s.currentSceneId?{...x,[k]:v}:x)}));
      const switchSc = (id) => setSt(s=>({...s, currentSceneId:id}));

      /* ── Personnages ── */
      const addChar = () => { const id=uid(), color=COLORS[characters.length%COLORS.length]; setSt(s=>({...s, characters:[...s.characters,{id, name:"Perso "+(s.characters.length+1), color, defaultTone:"neutre"}]})); };
      const upChar  = (id,k,v) => setSt(s=>({...s, characters:s.characters.map(c=>c.id===id?{...c,[k]:v}:c)}));
      const rmChar  = (id) => setSt(s=>({...s, characters:s.characters.filter(c=>c.id!==id), scenes:s.scenes.map(sc=>({...sc, lines:sc.lines.map(l=>l.characterId===id?{...l,characterId:""}:l)}))}));

      /* ── Lignes ── */
      const addLine = (type, afterId) => {
        const id=uid();
        setSt(s=>({...s, scenes:s.scenes.map(x=>{
          if (x.id!==s.currentSceneId) return x;
          const k = afterId ? x.lines.findIndex(l=>l.id===afterId) : -1;
          const pos = k>=0 ? k+1 : x.lines.length;
          const spk = type==="dialogue" ? pickSpeaker(s.characters, x.lines.slice(0,pos)) : (s.characters[0]?.id||"");
          const ch  = s.characters.find(c=>c.id===spk);
          const nl  = { id, type, characterId:spk, text:"", tone:ch?.defaultTone||"neutre", stageDirection:"" };
          const arr = [...x.lines]; arr.splice(pos,0,nl);
          return {...x, lines:arr};
        })}));
        setTimeout(()=>{ const el=document.querySelector(`[data-lid="${id}"] textarea, [data-lid="${id}"] input:not([type])`); if(el){ el.focus(); el.scrollIntoView?.({block:"nearest"}); } },40);
      };
      const upLine = (id,k,v) => setSt(s=>({...s, scenes:s.scenes.map(x=>x.id===s.currentSceneId?{...x, lines:x.lines.map(l=>l.id===id?{...l,[k]:v}:l)}:x)}));
      const rmLine = (id) => setSt(s=>({...s, scenes:s.scenes.map(x=>x.id===s.currentSceneId?{...x, lines:x.lines.filter(l=>l.id!==id)}:x)}));

      /* ── Drag & drop ── */
      const dStart = (i) => setDragIdx(i);
      const dOver  = (e,i) => { e.preventDefault(); setDragOver(i); };
      const dDrop  = (i) => {
        if (dragIdx===null||dragIdx===i){setDragIdx(null);setDragOver(null);return;}
        const nl=[...lines]; const [m]=nl.splice(dragIdx,1); nl.splice(i,0,m);
        upSc('lines',nl); setDragIdx(null); setDragOver(null);
      };
      const dEnd = () => {setDragIdx(null);setDragOver(null);};

      /* ── Entrée → réplique suivante (autre perso) ── */
      const lineKey = (e, l) => {
        if (quick && e.key==='Enter' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.nativeEvent?.isComposing) {
          e.preventDefault();
          if ((l.text||"").trim()) addLine("dialogue", l.id);
          return;
        }
        tabNext(e, l.id);
      };
      /* ── Tab → ligne suivante ── */
      const tabNext = (e, lineId) => {
        if (e.key!=='Tab') return;
        e.preventDefault();
        const idx = lines.findIndex(l=>l.id===lineId);
        for (let i=idx+1; i<lines.length; i++) {
          const el = document.querySelector(`[data-lid="${lines[i].id}"] textarea, [data-lid="${lines[i].id}"] input[type=text], [data-lid="${lines[i].id}"] input:not([type])`);
          if (el){ el.focus(); break; }
        }
      };

      /* ── Numéro de réplique dans la scène ── */
      const repNum = (lineId) => {
        let n=0;
        for (const l of lines) { if (l.type==="dialogue") n++; if (l.id===lineId) return n; }
        return 0;
      };

      /* ── Durée estimée ── */
      const dur = () => fmtDur(sceneSecs(sc));
      const totalSec = sumSecs(scenes);
      /* ── PDF direct ── */
      const pdf_ = () => {
        const JsPDF = window.jspdf?.jsPDF;
        if (!JsPDF) { toast_("PDF indisponible (connexion ?) — utilise Imprimer"); return; }
        try {
          const { doc, name } = buildPDF(st, JsPDF);
          try { doc.save(name); toast_("📄 PDF généré"); }
          catch { window.open(doc.output("bloburl")); }
        } catch (e) { console.error(e); toast_("Erreur PDF — utilise Imprimer"); }
      };

      /* ── Import / Export JSON ── */
      const exportJSON = () => {
        const a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:"application/json"}));
        a.download=`${film.title.replace(/\s+/g,"_")}.json`; a.click();
      };
      const importJSON = (e) => {
        const f=e.target.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=ev=>{ try{ const d=migrate(JSON.parse(ev.target.result)); if(d) setSt(d); else alert("Format invalide"); } catch{ alert("JSON invalide"); } };
        r.readAsText(f); e.target.value="";
      };

      /* ── Partage URL ── */
      const share = () => {
        const enc=encode(st); if(!enc){toast_("Erreur encodage");return;}
        const url=window.location.href.split('#')[0]+'#'+enc;
        navigator.clipboard.writeText(url).then(()=>toast_("🔗 Lien copié !")).catch(()=>toast_("Erreur clipboard"));
      };

      /* ── Impression directe ── */
      const print_ = () => {
        document.getElementById('print-area').innerHTML = buildPrintHtml(st);
        window.print();
      };

      /* ── Helpers UI ── */
      const getChar = id => characters.find(c=>c.id===id);
      const charSide = id => { const i=characters.findIndex(c=>c.id===id); return i===-1?"left":i%2===0?"left":"right"; };
      const repCount = id => lines.filter(l=>l.type==="dialogue"&&l.characterId===id).length;
      const inp = (x={}) => ({outline:"none", fontFamily:"inherit", ...x});

      /* Mettre à jour cmds.current à chaque render */
      cmds.current = { undo, addLine };

      /* ── Rendus de ligne ── */
      const rSilence = (l) => html`
        <div style=${{display:"flex",alignItems:"center",gap:10,padding:"10px 0"}}>
          <div style=${{flex:1,borderTop:"1px dashed "+BR}}/>
          <span style=${{color:MT,fontSize:10,letterSpacing:4,fontWeight:700,flexShrink:0}}>⏸ SILENCE</span>
          <div style=${{flex:1,borderTop:"1px dashed "+BR}}/>
          <button onClick=${()=>rmLine(l.id)} style=${{background:"transparent",border:"none",color:BR,cursor:"pointer",fontSize:13,padding:"0 4px"}}>✕</button>
        </div>`;

      const rStage = (l) => html`
        <div style=${{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",background:PU+"12",borderRadius:6,border:"1px dashed "+PU+"44"}}>
          <span style=${{color:PU,fontSize:13,flexShrink:0}}>(</span>
          <input style=${inp({flex:1,background:"transparent",border:"none",color:PU,fontStyle:"italic",fontSize:13})}
            value=${l.text} onInput=${e=>upLine(l.id,"text",e.target.value)}
            onKeyDown=${e=>tabNext(e,l.id)}
            placeholder="Didascalie générale — ambiance, action, décor…"/>
          <span style=${{color:PU,fontSize:13,flexShrink:0}}>)</span>
          <button onClick=${()=>rmLine(l.id)} style=${{background:"transparent",border:"none",color:BR,cursor:"pointer",fontSize:13}}>✕</button>
        </div>`;

      const rDialogue = (l) => {
        const char=getChar(l.characterId);
        const right=charSide(l.characterId)==="right";
        const bc=char?.color||BR;
        const n=repNum(l.id);
        return html`
          <div style=${{display:"flex",gap:10,alignItems:"flex-start",flexDirection:right?"row-reverse":"row"}}>
            <div style=${{width:34,height:34,borderRadius:"50%",background:bc,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:14,flexShrink:0,marginTop:26,color:"rgba(0,0,0,0.75)",boxShadow:"0 0 10px "+bc+"44"}}>
              ${(char?.name||"?")[0].toUpperCase()}
            </div>
            <div style=${{flex:1,minWidth:0}}>
              <div style=${{display:"flex",alignItems:"center",gap:5,marginBottom:4,flexDirection:right?"row-reverse":"row"}}>
                <span style=${{color:BR,fontSize:10,fontWeight:700,flexShrink:0,minWidth:16,textAlign:"center",fontVariantNumeric:"tabular-nums"}}>${n}</span>
                <select value=${l.characterId} onChange=${e=>upLine(l.id,"characterId",e.target.value)}
                  style=${{background:S2,border:"2px solid "+bc,color:TX,borderRadius:5,padding:"2px 6px",fontSize:11,fontFamily:"inherit",fontWeight:700}}>
                  <option value="">— Personnage —</option>
                  ${characters.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
                </select>
                <select value=${l.tone} onChange=${e=>upLine(l.id,"tone",e.target.value)}
                  style=${{background:S2,border:"1px solid "+BR,color:MT,borderRadius:5,padding:"2px 6px",fontSize:10,fontFamily:"inherit",fontStyle:"italic"}}>
                  ${TONES.map(t=>html`<option key=${t} value=${t}>${t}</option>`)}
                </select>
                <button onClick=${()=>rmLine(l.id)} style=${{background:"transparent",border:"none",color:BR,cursor:"pointer",fontSize:12,marginLeft:right?"auto":0,marginRight:right?0:"auto"}}>✕</button>
              </div>
              <textarea value=${l.text} onInput=${e=>upLine(l.id,"text",e.target.value)}
                onKeyDown=${e=>lineKey(e,l)} placeholder="Réplique…" rows=${2}
                style=${{outline:"none",fontFamily:"'Courier Prime',monospace",width:"100%",background:S2,
                  border:"1px solid "+BR,
                  borderLeft:right?"1px solid "+BR:"3px solid "+bc,
                  borderRight:right?"3px solid "+bc:"1px solid "+BR,
                  color:TX,borderRadius:8,padding:"7px 12px",fontSize:14,resize:"none",lineHeight:1.6}}></textarea>
              <input style=${inp({width:"100%",background:"transparent",border:"none",borderBottom:"1px dashed "+BR,color:PU,fontStyle:"italic",fontSize:11,padding:"3px 0",marginTop:3})}
                value=${l.stageDirection} onInput=${e=>upLine(l.id,"stageDirection",e.target.value)}
                onKeyDown=${e=>tabNext(e,l.id)}
                placeholder="( didascalie de réplique optionnelle… )"/>
            </div>
          </div>`;
      };

      /* ══ RENDU PRINCIPAL ══ */
      return html`
        <div style=${{background:D,color:TX,height:"100vh",fontFamily:"'Syne',sans-serif",display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>

          ${toast && html`
            <div style=${{position:"fixed",top:14,left:"50%",transform:"translateX(-50%)",background:AC,color:"#000",padding:"7px 20px",borderRadius:20,fontWeight:700,fontSize:13,zIndex:9999,boxShadow:"0 4px 20px rgba(0,0,0,0.5)",whiteSpace:"nowrap"}}>
              ${toast}
            </div>`}

          ${showSC && html`
            <div onClick=${()=>setShowSC(false)} style=${{position:"fixed",inset:0,zIndex:998}}/>
            <div style=${{position:"fixed",bottom:58,right:14,background:S,border:"1px solid "+BR,borderRadius:10,padding:16,zIndex:999,minWidth:250,boxShadow:"0 8px 32px rgba(0,0,0,0.6)"}}>
              <div style=${{color:AC,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:12}}>⌨ Raccourcis clavier</div>
              ${SHORTCUTS.map(([k,d])=>html`
                <div key=${k} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginBottom:7}}>
                  <code style=${{background:S2,border:"1px solid "+BR,borderRadius:4,padding:"2px 8px",fontSize:11,color:TX,fontFamily:"monospace",flexShrink:0}}>${k}</code>
                  <span style=${{color:MT,fontSize:12}}>${d}</span>
                </div>`)}
              <div style=${{borderTop:"1px solid "+BR,marginTop:10,paddingTop:8,color:BR,fontSize:9,textTransform:"uppercase",letterSpacing:1}}>💾 Sauvegarde auto activée</div>
            </div>`}

          <!-- HEADER -->
          <header style=${{background:S,borderBottom:"1px solid "+BR,padding:"8px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style=${{fontSize:21,fontWeight:900,letterSpacing:-1,flexShrink:0,lineHeight:1,userSelect:"none"}}>
              <span style=${{color:TX}}>blabla</span><span style=${{color:AC}}>rzac</span>
              <div style=${{fontSize:8,color:MT,letterSpacing:2,fontWeight:400,textTransform:"uppercase",marginTop:1}}>script & dialogue</div>
            </div>

            <div style=${{flex:1,minWidth:160}}>
              <input style=${inp({background:"transparent",border:"none",color:TX,fontSize:16,fontWeight:800,width:"100%",lineHeight:1.2})}
                value=${film.title} onInput=${e=>upFilm("title",e.target.value)} placeholder="Titre du film"/>
              <div style=${{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                <span style=${{color:AC,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,flexShrink:0,minWidth:26}}>Séq.</span>
                <input title="Numéro de séquence" style=${inp({background:S2,border:"1px solid "+BR,color:TX,width:38,padding:"1px 4px",borderRadius:4,fontSize:11,textAlign:"center"})}
                  value=${seq.number} onInput=${e=>upSeq(seq.id,"number",e.target.value)}/>
                <span style=${{color:MT,flexShrink:0}}>—</span>
                <input style=${inp({background:"transparent",border:"none",borderBottom:"1px solid "+BR,color:TX,padding:"1px 4px",fontSize:11,flex:1,minWidth:0})}
                  value=${seq.name} onInput=${e=>upSeq(seq.id,"name",e.target.value)} placeholder="Nom de la séquence"/>
              </div>
              <div style=${{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                <span style=${{color:AC,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,flexShrink:0,minWidth:26}}>Sc.</span>
                <input title="Numéro de scène" style=${inp({background:S2,border:"1px solid "+BR,color:TX,width:38,padding:"1px 4px",borderRadius:4,fontSize:11,textAlign:"center"})}
                  value=${sc.number} onInput=${e=>upSc("number",e.target.value)}/>
                <span style=${{color:MT,flexShrink:0}}>—</span>
                <input style=${inp({background:"transparent",border:"none",borderBottom:"1px solid "+BR,color:TX,padding:"1px 4px",fontSize:11,flex:1,minWidth:0})}
                  value=${sc.name} onInput=${e=>upSc("name",e.target.value)} placeholder="Nom de la scène"/>
                <span style=${{color:AC,fontSize:10,fontWeight:700,background:AC+"18",border:"1px solid "+AC+"44",padding:"2px 8px",borderRadius:20,flexShrink:0,whiteSpace:"nowrap"}}>⏱ ${dur()}</span>
                <span title="Durée totale estimée du film" style=${{color:MT,fontSize:10,fontWeight:700,border:"1px solid "+BR,padding:"2px 8px",borderRadius:20,flexShrink:0,whiteSpace:"nowrap"}}>Σ ${fmtDur(totalSec)}</span>
              </div>
            </div>

            <div style=${{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <button onClick=${share} style=${{background:"transparent",border:"1px solid "+BR,color:TX,padding:"4px 9px",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>🔗 Partager</button>
              <button onClick=${()=>fileRef.current.click()} style=${{background:"transparent",border:"1px solid "+BR,color:MT,padding:"4px 9px",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>↑ Import</button>
              <input ref=${fileRef} type="file" accept=".json" style=${{display:"none"}} onChange=${importJSON}/>
              <button onClick=${exportJSON} style=${{background:"transparent",border:"1px solid "+BR,color:TX,padding:"4px 9px",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>↓ JSON</button>
              <label title="Commencer chaque séquence sur une nouvelle page (PDF et impression)" style=${{display:"flex",alignItems:"center",gap:4,color:MT,fontSize:10,cursor:"pointer",userSelect:"none"}}>
                <input type="checkbox" checked=${film.pageBreak!==false} onChange=${e=>upFilm("pageBreak",e.target.checked)}/> 1 séq. / page
              </label>
              <button onClick=${pdf_} style=${{background:AC,border:"none",color:"#000",padding:"4px 12px",borderRadius:5,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit"}}>⬇ PDF</button>
              <button onClick=${print_} style=${{background:"transparent",border:"1px solid "+BR,color:TX,padding:"4px 9px",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>🖨 Imprimer</button>
            </div>
          </header>

          <div style=${{display:"flex",flex:1,overflow:"hidden"}}>

            <!-- SIDEBAR -->
            <aside style=${{width:218,background:S,borderRight:"1px solid "+BR,display:"flex",flexDirection:"column",flexShrink:0}}>
              <div style=${{display:"flex",borderBottom:"1px solid "+BR}}>
                ${[["scenes","🎬 Scènes"],["info","📋 Infos"],["chars","🎭 Persos"]].map(([p,label])=>html`
                  <button key=${p} onClick=${()=>setPanel(p)} style=${{flex:1,padding:"7px 2px",background:"transparent",border:"none",color:panel===p?AC:MT,borderBottom:panel===p?"2px solid "+AC:"2px solid transparent",cursor:"pointer",fontSize:10,fontFamily:"inherit",fontWeight:panel===p?700:400}}>${label}</button>`)}
              </div>

              <div style=${{flex:1,overflowY:"auto",padding:10}}>

                ${panel==="scenes" && html`<div>
                  <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",background:S2,border:"1px solid "+BR,borderRadius:7,padding:"7px 10px",marginBottom:12}}>
                    <span style=${{color:MT,fontSize:9,letterSpacing:1.5,textTransform:"uppercase"}}>Durée totale</span>
                    <span style=${{color:AC,fontWeight:800,fontSize:13}}>⏱ ${fmtDur(totalSec)}</span>
                  </div>
                  ${sequences.map((q,qi)=>{
                    const items = scenes.filter(x=>x.sequenceId===q.id);
                    return html`
                    <div key=${q.id} style=${{marginBottom:14}}>
                      <div style=${{display:"flex",alignItems:"center",gap:3,marginBottom:6,padding:"0 2px"}}>
                        <span style=${{color:AC,fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",flexShrink:0}}>Séq. ${q.number}</span>
                        <span style=${{color:MT,fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginLeft:4}}>${q.name}</span>
                        ${qi>0 && html`<button title="Monter la séquence" onClick=${()=>moveSeq(q.id,-1)} style=${{background:"transparent",border:"none",color:MT,cursor:"pointer",fontSize:11,padding:"0 2px"}}>↑</button>`}
                        ${qi<sequences.length-1 && html`<button title="Descendre la séquence" onClick=${()=>moveSeq(q.id,1)} style=${{background:"transparent",border:"none",color:MT,cursor:"pointer",fontSize:11,padding:"0 2px"}}>↓</button>`}
                        ${sequences.length>1 && html`<button title="Supprimer la séquence" onClick=${()=>rmSequence(q.id)} style=${{background:"transparent",border:"none",color:BR,cursor:"pointer",fontSize:12,padding:"0 2px"}}>✕</button>`}
                      </div>
                      <div style=${{fontSize:9,color:MT,margin:"-2px 2px 7px"}}>⏱ ${fmtDur(sumSecs(items))} · ${items.length} scène${items.length>1?"s":""}</div>
                      ${items.map((x,xi)=>html`
                        <div key=${x.id} onClick=${()=>switchSc(x.id)}
                          style=${{background:x.id===st.currentSceneId?AC+"1e":S2,borderRadius:7,padding:"8px 10px",marginBottom:6,cursor:"pointer",border:x.id===st.currentSceneId?"1px solid "+AC+"55":"1px solid "+BR,transition:"background 0.15s"}}>
                          <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:4}}>
                            <span style=${{fontWeight:700,fontSize:12,color:x.id===st.currentSceneId?AC:TX,flexShrink:0}}>Sc. ${x.number}</span>
                            <span style=${{color:MT,fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginLeft:6}}>${x.name}</span>
                            ${x.id===st.currentSceneId && xi>0 && html`<button title="Monter" onClick=${e=>{e.stopPropagation();moveScene(x.id,-1);}} style=${{background:"transparent",border:"none",color:MT,cursor:"pointer",fontSize:11,flexShrink:0,padding:"0 2px"}}>↑</button>`}
                            ${x.id===st.currentSceneId && xi<items.length-1 && html`<button title="Descendre" onClick=${e=>{e.stopPropagation();moveScene(x.id,1);}} style=${{background:"transparent",border:"none",color:MT,cursor:"pointer",fontSize:11,flexShrink:0,padding:"0 2px"}}>↓</button>`}
                            ${scenes.length>1 && html`<button onClick=${e=>{e.stopPropagation();rmScene(x.id);}} style=${{background:"transparent",border:"none",color:BR,cursor:"pointer",fontSize:12,flexShrink:0,padding:"0 2px"}}>✕</button>`}
                          </div>
                          <div style=${{fontSize:9,color:BR,marginTop:3}}>${x.lines.filter(l=>l.type==="dialogue").length} réplique(s)</div>
                        </div>`)}
                      <button onClick=${()=>addScene(q.id)} style=${{width:"100%",background:"transparent",border:"1px dashed "+BR,color:AC,padding:"5px",borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>
                        + Scène dans la séq. ${q.number}
                      </button>
                    </div>`; })}
                  <button onClick=${addSequence} style=${{width:"100%",background:AC+"18",border:"1px solid "+AC+"66",color:AC,padding:"8px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>
                    + Nouvelle séquence
                  </button>
                </div>`}

                ${panel==="info" && html`<div>
                  <div style=${{color:MT,fontSize:9,textTransform:"uppercase",letterSpacing:1.5,marginBottom:4}}>Séquence de cette scène</div>
                  <select value=${sc.sequenceId} onChange=${e=>setSceneSeq(sc.id,e.target.value)}
                    style=${{width:"100%",background:S2,border:"1px solid "+BR,color:TX,borderRadius:6,padding:"5px 6px",fontSize:11,fontFamily:"inherit",marginBottom:12}}>
                    ${sequences.map(q=>html`<option key=${q.id} value=${q.id}>Séq. ${q.number}${q.name?" — "+q.name:""}</option>`)}
                  </select>
                  <div style=${{color:MT,fontSize:9,textTransform:"uppercase",letterSpacing:1.5,marginBottom:4}}>Accessoires</div>
                  <textarea style=${inp({width:"100%",background:S2,border:"1px solid "+BR,color:TX,borderRadius:6,padding:"6px 8px",fontSize:11,resize:"none"})}
                    value=${sc.props} onInput=${e=>upSc("props",e.target.value)} placeholder="Couteau, téléphone, valise…" rows=${3}></textarea>
                  <div style=${{color:MT,fontSize:9,textTransform:"uppercase",letterSpacing:1.5,marginBottom:4,marginTop:12}}>Notes de mise en scène</div>
                  <textarea style=${inp({width:"100%",background:S2,border:"1px solid "+BR,color:TX,borderRadius:6,padding:"6px 8px",fontSize:11,resize:"none"})}
                    value=${sc.notes} onInput=${e=>upSc("notes",e.target.value)} placeholder="Lumière, ambiance, déplacements, intentions…" rows=${9}></textarea>
                  <div style=${{color:MT,fontSize:9,marginTop:10,lineHeight:1.6}}>
                    ${lines.filter(l=>l.type==="dialogue").length} répliques · ${lines.filter(l=>l.type==="silence").length} silence(s)
                  </div>
                </div>`}

                ${panel==="chars" && html`<div>
                  ${characters.map(c=>html`
                    <div key=${c.id} style=${{background:S2,borderRadius:8,padding:10,marginBottom:9,border:"1px solid "+BR,borderLeft:"3px solid "+c.color}}>
                      <div style=${{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
                        <div style=${{width:11,height:11,borderRadius:"50%",background:c.color,flexShrink:0}}/>
                        <input style=${inp({flex:1,background:"transparent",border:"none",color:TX,fontWeight:700,fontSize:13})}
                          value=${c.name} onInput=${e=>upChar(c.id,"name",e.target.value)}/>
                        <button onClick=${()=>rmChar(c.id)} style=${{background:"transparent",border:"none",color:MT,cursor:"pointer",fontSize:13}}>✕</button>
                      </div>
                      <div style=${{display:"flex",gap:6,alignItems:"center",marginBottom:5}}>
                        <input type="color" value=${c.color} onChange=${e=>upChar(c.id,"color",e.target.value)}
                          style=${{width:24,height:19,border:"1px solid "+BR,borderRadius:3,background:"transparent",cursor:"pointer",padding:1}}/>
                        <select value=${c.defaultTone} onChange=${e=>upChar(c.id,"defaultTone",e.target.value)}
                          style=${{flex:1,background:S,border:"1px solid "+BR,color:TX,borderRadius:4,padding:"3px",fontSize:10,fontFamily:"inherit"}}>
                          ${TONES.map(t=>html`<option key=${t} value=${t}>${t}</option>`)}
                        </select>
                      </div>
                      <div style=${{color:MT,fontSize:9}}>${repCount(c.id)} réplique(s) · ${characters.findIndex(x=>x.id===c.id)%2===0?"gauche":"droite"}</div>
                    </div>`)}
                  <button onClick=${addChar} style=${{width:"100%",background:"transparent",border:"1px dashed "+BR,color:AC,padding:"7px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
                    + Ajouter un personnage
                  </button>
                </div>`}

              </div>
            </aside>

            <!-- MAIN DIALOGUE -->
            <main style=${{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style=${{flex:1,overflowY:"auto",padding:"14px 18px"}}>

                ${lines.length===0 && html`
                  <div style=${{textAlign:"center",padding:"60px 20px",opacity:0.28}}>
                    <div style=${{fontSize:50,marginBottom:12}}>🎬</div>
                    <div style=${{fontSize:14,color:MT}}>Commence ton dialogue ci-dessous</div>
                    <div style=${{fontSize:11,color:MT,marginTop:5}}>Crée d'abord tes personnages dans l'onglet Persos</div>
                  </div>`}

                ${lines.map((l,i)=>html`
                  <div key=${l.id} className="ldrag" data-lid=${l.id}
                    draggable=${true}
                    onDragStart=${()=>dStart(i)} onDragOver=${e=>dOver(e,i)} onDrop=${()=>dDrop(i)} onDragEnd=${dEnd}
                    style=${{position:"relative",marginBottom:7,cursor:"grab",opacity:dragIdx===i?0.2:1,transition:"opacity 0.1s"}}>
                    ${dragOver===i&&dragIdx!==i && html`<div style=${{height:3,background:AC,borderRadius:2,marginBottom:5,boxShadow:"0 0 8px "+AC}}/>`}
                    <div className="dh" style=${{position:"absolute",left:-14,top:"50%",transform:"translateY(-50%)",color:BR,fontSize:13,opacity:0,transition:"opacity 0.2s",userSelect:"none",pointerEvents:"none"}}>⠿</div>
                    ${l.type==="silence"        && rSilence(l)}
                    ${l.type==="stage_direction"&& rStage(l)}
                    ${l.type==="dialogue"       && rDialogue(l)}
                  </div>`)}
              </div>

              <!-- BARRE OUTILS -->
              <div style=${{background:S,borderTop:"1px solid "+BR,padding:"9px 14px",display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}}>
                <button onClick=${()=>addLine("dialogue")} style=${{background:AC,border:"none",color:"#000",padding:"7px 15px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>+ Réplique</button>
                <button onClick=${()=>addLine("silence")} style=${{background:"transparent",border:"1px solid "+BR,color:MT,padding:"7px 13px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>⏸ Silence</button>
                <button onClick=${()=>addLine("stage_direction")} style=${{background:"transparent",border:"1px solid "+PU+"55",color:PU,padding:"7px 13px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>( ) Didascalie</button>
                <button onClick=${undo} title="Annuler (Ctrl+Z)" style=${{background:"transparent",border:"1px solid "+BR,color:MT,padding:"7px 10px",borderRadius:6,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>↩</button>
                <button onClick=${toggleQuick} title="Entrée = réplique suivante avec l'autre personnage · Maj+Entrée = retour à la ligne"
                  style=${{background:quick?AC+"22":"transparent",border:"1px solid "+(quick?AC+"88":BR),color:quick?AC:MT,padding:"7px 11px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>↵ Enchaînement ${quick?"ON":"OFF"}</button>
                <div style=${{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
                  <span style=${{color:BR,fontSize:9,letterSpacing:1,textTransform:"uppercase"}}>💾 auto</span>
                  <button onClick=${()=>setShowSC(v=>!v)} title="Raccourcis clavier"
                    style=${{background:showSC?AC+"33":S2,border:"1px solid "+(showSC?AC:BR),color:showSC?AC:MT,width:26,height:26,borderRadius:"50%",cursor:"pointer",fontSize:12,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}>?</button>
                </div>
              </div>
            </main>
          </div>
        </div>`;
    }

    createRoot(document.getElementById("root")).render(html`<${App}/>`);
  </script>
</body>
</html>
